[package]
name = "smolvm-resourced"
version = "1.37.2"
edition = "2021"
license = "Apache-2.0"
description = "Worker-scoped resource catalog for the Linux runtime"

[target.'cfg(target_os = "linux")'.dependencies]
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tempfile = "3"
