[package]
name = "smolvm-resourced"
version = "1.37.2"
edition = "2021"
license = "Apache-2.0"
description = "Worker-scoped resource catalog for the Linux runtime"

[target.'cfg(target_os = "linux")'.dependencies]
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
hex = "0.4"
imago = { version = "0.2.3", features = ["sync-wrappers"] }
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
smolvm-network = { path = "../smolvm-network" }
socket2 = { version = "0.6", features = ["all"] }
smolvm-checkpoint = { path = "../smolvm-checkpoint" }
smolvm-runtime-protocol = { path = "../smolvm-runtime-protocol" }
tempfile = "3"
tokio = { version = "1.54", features = ["rt"] }
